name: oryzaelo_ui
description: "A new Flutter package project."
version: 0.0.1
homepage:

environment:
  sdk: ^3.11.1
  flutter: ">=1.17.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

flutter:
  fonts:
    - family: Ubuntu Sans
      fonts:
        - asset: assets/fonts/UbuntuSans-Variable.ttf
        - asset: assets/fonts/UbuntuSans-Italic-Variable.ttf
          style: italic
    - family: Ubuntu Sans Mono
      fonts:
        - asset: assets/fonts/UbuntuSansMono-Variable.ttf
